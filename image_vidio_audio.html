<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimedia</title>
</head>
<body>
    <!--Image-->
    <h2>Image in HTML</h2>
    <img src="My Husband.jpeg" width="100" height="100" alt="My Husband">

    <!--Audio-->
    <h2>Audio in HTML</h2>
    <audio controls>
        <source src="ahay.mpeg" type="audio/mpeg">
    </audio>
    <!--Video-->
    <h2> Video in HTML</h2>
    <video width="340" height="240" controls poster="haha.jpeg">
        <source src="Gaje.mp4" type="video/mp4">
    </video>

</body>
</html>
