<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML List</title>
</head>
<body>
    <h1>HTML list</h1>
    <hr>
    <ol>
        <li>Monday</li>
        <li>Tuesday</li>
        <li>Wednesday</li>
    </ol>
    <ul type="square">
        <li>monday</li>
        <li>tuesday</li>
    </ul>
    <ul type="circle">
        <il>Monday</il>
        <il>Tuesday</il>
        <il>Wednesday</il>
    </ul>
    <dl>
        <dt>HTML</dt>
            <dd>HyperText Markup Language</dd>
        <dt>CSS</dt>
            <dd>Cascading Style Sheets</dd>
            
    </dl>

</body>
</html>
